<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jordy Bonnet - Excalidraw Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    #drawing-container {
      overflow: auto;
      max-width: 100%;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #excalidraw-svg {
      width: 100%;
      display: block;
    }
    .controls {
      text-align: center;
      margin-top: 15px;
    }
    .controls button {
      padding: 8px 16px;
      margin: 0 5px;
      border: none;
      background: #4a90d9;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .controls button:hover {
      background: #357abd;
    }
    a.back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #4a90d9;
      text-decoration: none;
    }
    a.back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Skills Overview - Excalidraw Diagram</h1>
  
  <div id="drawing-container">
    <img src="CV_jordy_bonnet_excali.svg" id="excalidraw-svg" alt="Jordy Bonnet Skills Diagram" />
  </div>

  <div class="controls">
    <button onclick="panzoomInstance.zoomIn()">Zoom +</button>
    <button onclick="panzoomInstance.zoomOut()">Zoom -</button>
    <button onclick="panzoomInstance.reset()">Reset</button>
  </div>

  <a href="README_next.md" class="back-link">← Retour au CV</a>

  <script src="https://unpkg.com/panzoom@11.0.5/dist/panzoom.min.js"></script>
  <script>
    var el = document.getElementById('excalidraw-svg');
    window.panzoomInstance = Panzoom(el, {
      initialZoom: 0.8,
      minZoom: 0.3,
      maxZoom: 5,
      panEnabled: true,
      disablePan: false,
      mouseWheelZoom: true
    });
  </script>
</body>
</html>
